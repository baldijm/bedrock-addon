name: Desplegar staging

on:
  push:
    branches: [main]
    paths:
      - BP/**
      - RP/**
      - experimental/SPB_HTTP_Test/**
      - ops/addon_deploy.py
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:
    inputs:
      commit:
        description: SHA completo a desplegar; vacío usa el commit seleccionado
        required: false
        type: string

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Preparar clave SSH temporal
        env:
          SSH_KEY: ${{ secrets.BEDROCK_STAGING_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/bedrock-staging
          chmod 600 ~/.ssh/bedrock-staging
      - name: Desplegar exactamente este commit en staging
        env:
          HOST: ${{ secrets.BEDROCK_STAGING_HOST }}
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/bedrock-staging "azureuser@$HOST" \
            "sudo /opt/bedrock-deploy/addon_deploy.py staging --commit '$REQUESTED_COMMIT'"
